# RQ3 (cost of observability): cloud, WAN 50 ms, loss 0; level {minimal, full} x 3 rep. SINGLE-SITE binding: same intent, everything on SLICES-Gent (no federation).
experiment:
  id: traffic-placement-v1
  version: 1.0.0
  hypothesis: "Fog placement of state estimation reduces control-loop latency vs cloud"
  owner: unime-mdslab
  federated: false

infrastructure:
  sites:
    - {id: edge-me, tier: edge,  domain: slices-gent, site: be-gent1-bi-vm1, nodes: 1, flavor: tiny, emulated: true}
    - {id: fog-x,   tier: fog,   domain: slices-gent, site: be-gent1-bi-vm1, nodes: 1, flavor: medium}
    - {id: cloud-x, tier: cloud, domain: slices-gent, site: be-gent1-bi-vm1, nodes: 1, flavor: small}
  links:
    - {from: edge-me, to: fog-x,   profile: lan}
    - {from: fog-x,   to: cloud-x, profile: wan}
  impairments:
    wan: {delay_ms: [50], jitter_ms: 5, loss_pct: [0]}

application:
  class: control-cps
  components:
    - {name: detector-gw,       placement: edge}
    - {name: state-estimator,   placement: cloud}
    - {name: signal-controller, placement: fog}
    - {name: actuator,          placement: edge}
  dataflows:
    - {from: detector-gw,       to: state-estimator,   rate_hz: 1}
    - {from: state-estimator,   to: signal-controller, rate_hz: 1}
    - {from: signal-controller, to: actuator,          rate_hz: 0.2}
  # calibration deadline: between the end-to-end cloud latency at 50 ms (~175 ms) and at 100 ms (~275 ms); not a domain requirement
  timing: {control_period_s: 1, deadline_ms: 250}
  workload_profile: sumo-scenario-v1

observability:
  level: [minimal, full]   # factor: full adds an agent per node (CPU, memory, network, RTT probes)
  clock_sync: chrony
  metrics: [app.e2e_latency, app.deadline_miss, cps.avg_wait_time, cps.queue_length, app.gateway_cpu, net.rtt, infra.cpu, infra.mem, net.rx_bytes, net.tx_bytes, net.rtt_probe]
  traces: none
  sampling_s: 1

conditions:
  recorded: [background_load, wan_rtt_baseline, clock_offset]

execution:
  repetitions: 3
  duration_min: 5
  warmup_min: 0.5
  termination: {on: [duration]}   # real backends always measure the whole duration

provenance:
  capture: [descriptor_hash, node_inventory, impairment_log, seed, code_version, conditions]
  format: json
